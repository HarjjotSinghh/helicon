<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBFCFE" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101113" />
    <title>Helicon</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Resolve the theme before first paint so neither theme flashes the other.
      (function () {
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = dark ? "dark" : "light";
        try {
          var saved = JSON.parse(localStorage.getItem("helicon.prefs.v1") || "{}").theme;
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
