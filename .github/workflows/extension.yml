name: Extension

# Publishes the editor extension (apps/vscode) to the VS Code Marketplace and Open VSX on every release tag,
# and attaches the .vsix to the GitHub Release so it can be installed by hand ("Install from VSIX...").
#
# Needs two repository secrets; a store whose secret is missing is skipped, not failed:
#   VSCE_PAT  an Azure DevOps personal access token with the Marketplace > Manage scope
#   OVSX_PAT  an Open VSX access token (open-vsx.org > Settings > Access Tokens)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @helicon/daemon --workspace @helicon/ui --workspace @helicon/server
      - run: npm run build --workspace @helicon/web
      - name: Check the extension version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./apps/vscode/package.json').version")"
          if [ "$want" != "$have" ]; then echo "apps/vscode is $have but the tag is $want"; exit 1; fi
      - run: npm run test --workspace helicon
      - run: npm run package --workspace helicon
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: apps/vscode
        run: npx --yes @vscode/vsce@4.0.0 publish --packagePath helicon.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: apps/vscode
        run: npx --yes ovsx@1.2.0 publish helicon.vsix -p "$OVSX_PAT"
      - name: Attach the .vsix to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # The Release workflow creates the release; wait for it rather than racing it.
        run: |
          for i in $(seq 1 60); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "apps/vscode/helicon.vsix#helicon-${GITHUB_REF_NAME#v}.vsix" --clobber
              exit 0
            fi
            sleep 30
          done
          echo "No release for $GITHUB_REF_NAME after 30 minutes"; exit 1
