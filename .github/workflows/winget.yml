name: Publish to WinGet

# Every release after the first one. The community repository takes manifests by pull request, and the action builds
# them from the version already published there, so `packaging/winget` has to land by hand once first.
on:
  release:
    types: [released]
  workflow_dispatch:

jobs:
  winget:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the publishing token
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        # Without the token there is nothing to submit with, and a missing secret should not fail a release.
        run: |
          if [ -n "$WINGET_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No WINGET_TOKEN secret, so nothing is submitted. See packaging/winget/README.md."
          fi
      # Pinned to a commit: this step is handed a token that can push to our forks, so a moved tag must not
      # change what runs. Bump it deliberately, the way the release workflow pins tauri-action.
      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        if: steps.token.outputs.ready == 'true'
        with:
          identifier: HarjjotSinghh.Helicon
          token: ${{ secrets.WINGET_TOKEN }}
          # The Windows installer only; the DMG and AppImage are not winget's business.
          installers-regex: '_x64-setup\.exe$'
