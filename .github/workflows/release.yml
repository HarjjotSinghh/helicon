name: Release

on:
  push:
    tags: ["v*"]
  # Rebuilds and republishes an existing tag: `gh workflow run release.yml --ref vX.Y.Z`. It runs the workflow file as
  # it is at that tag, so it works for tags made after this line was added.
  workflow_dispatch:

jobs:
  desktop-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build --workspace @helicon/daemon --workspace @helicon/ui --workspace @helicon/server
      # Pinned to a commit: this step holds the updater signing key, so a moved tag must not change what runs.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # Which Node.js sidecar beforeBuildCommand bundles (apps/desktop/scripts/fetch-node.mjs).
          HELICON_NODE_TARGET: x86_64-pc-windows-msvc
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installer for the in-app updater, which also publishes latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Helicon ${{ github.ref_name }}"
          releaseBody: "Bundles Node.js, so the only requirement is the Muse CLI with muse login (Muse for Windows natively, or inside WSL2). macOS builds are not Apple-notarized yet, so the first launch needs a right-click, then Open."
          releaseDraft: false
          # A full release, so the updater's releases/latest/download/latest.json always points at it.
          prerelease: false
          # GitHub sometimes refuses a large asset upload ("Error saving asset"); retrying saves a manual job rerun.
          retryAttempts: 3
          args: --target x86_64-pc-windows-msvc

  desktop-macos:
    permissions:
      contents: write
    # After Windows, not beside it: both jobs merge their platform into the release's latest.json,
    # which is a read-modify-write that concurrent jobs could clobber, silently dropping a platform
    # from auto-update.
    needs: desktop-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin needs both halves installed; aarch64 is already the runner default.
          targets: x86_64-apple-darwin
      - run: npm ci
      - run: npm run build --workspace @helicon/daemon --workspace @helicon/ui --workspace @helicon/server
      # Pinned to a commit: this step holds the updater signing key, so a moved tag must not change what runs.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # Which Node.js sidecar beforeBuildCommand bundles (apps/desktop/scripts/fetch-node.mjs).
          HELICON_NODE_TARGET: universal-apple-darwin
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installer for the in-app updater, which also publishes latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Helicon ${{ github.ref_name }}"
          releaseBody: "Bundles Node.js, so the only requirement is the Muse CLI with muse login (Muse for Windows natively, or inside WSL2). macOS builds are not Apple-notarized yet, so the first launch needs a right-click, then Open."
          releaseDraft: false
          # A full release, so the updater's releases/latest/download/latest.json always points at it.
          prerelease: false
          # GitHub sometimes refuses a large asset upload ("Error saving asset"); retrying saves a manual job rerun.
          retryAttempts: 3
          # One universal binary for Apple Silicon and Intel; the macOS bundles come from tauri.macos.conf.json.
          args: --target universal-apple-darwin

  desktop-linux:
    permissions:
      contents: write
    needs: desktop-macos
    runs-on: ubuntu-22.04
    # A hang must not leave Linux on the old AppImage for the 6h default.
    timeout-minutes: 60
    steps:
      # No persisted credentials: the repack step below executes downloaded code with this
      # checkout as its working directory, and the default would leave the write-scoped
      # GITHUB_TOKEN in .git/config. The gh steps get the token through their own step env.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        # xvfb/strace/patchelf are quick-sharun inputs: strace mode executes the GUI app.
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev squashfs-tools xvfb strace patchelf
      - run: npm ci
      - run: npm run build --workspace @helicon/daemon --workspace @helicon/ui --workspace @helicon/server
      # Pinned to a commit: this step holds the updater signing key, so a moved tag must not change what runs.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # Which Node.js sidecar beforeBuildCommand bundles (apps/desktop/scripts/fetch-node.mjs).
          HELICON_NODE_TARGET: x86_64-unknown-linux-gnu
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installer for the in-app updater, which also publishes latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Helicon ${{ github.ref_name }}"
          releaseBody: "Bundles Node.js, so the only requirement is the Muse CLI with muse login (Muse for Windows natively, or inside WSL2). macOS builds are not Apple-notarized yet, so the first launch needs a right-click, then Open."
          releaseDraft: false
          # A full release, so the updater's releases/latest/download/latest.json always points at it.
          prerelease: false
          # GitHub sometimes refuses a large asset upload ("Error saving asset"); retrying saves a manual job rerun.
          retryAttempts: 3
          args: --target x86_64-unknown-linux-gnu
      # The classic (linuxdeploy) runtime exports LD_LIBRARY_PATH into every child the app spawns, so
      # system tools inherit the bundle's older libraries (e.g. git dying on a missing libnghttp2 symbol),
      # and it bundles Ubuntu 22.04's libwayland-*, which newer host Mesa rejects with EGL_BAD_ALLOC before
      # the window opens (tauri-apps/tauri#15665). Re-bundle with sharun instead: it passes --library-path
      # to its own interpreter, so nothing leaks to child processes, and it bundles the libraries the app
      # actually loads. Then re-sign and republish under the same asset name, so the updater URLs in
      # latest.json keep working.
      #
      # The pins live in the script; the smoke workflow calls it too, so CI covers what ships.
      - name: Download the published AppImage
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/classic"
          mkdir -p "$dl"
          # gh infers the repository from the git remote, and the token stays in this step:
          # the repack step below runs the app itself and must not see any secrets.
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.AppImage" --clobber --dir "$dl"
          echo "CLASSIC_DIR=$dl" >> "$GITHUB_ENV"
      - name: Re-bundle with sharun
        # Deliberately secret-free: this step executes the downloaded script, four downloaded
        # binaries and the packaged app, so the signing key and release token stay out of its env.
        run: |
          set -euo pipefail
          count=0
          classic=""
          for f in "$CLASSIC_DIR"/Helicon_*_amd64.AppImage; do
            [ -e "$f" ] || break
            count=$((count + 1))
            classic="$f"
          done
          [ "$count" -eq 1 ] || { echo "expected one classic AppImage, found $count"; exit 1; }
          # A downloaded release asset does not keep its executable bit.
          chmod +x "$classic"
          work="$(mktemp -d)"
          # The packed image path below is kept for the sign step; cleaned by the runner.
          (cd "$work" && "$classic" --appimage-extract >/dev/null)
          packed="$(sh "${{ github.workspace }}/apps/desktop/scripts/sharun-repack.sh" "$work/squashfs-root" "$work/out")"
          # Keep the release asset name; only the signature changes below.
          base="$(basename "$classic")"
          mv "$packed" "$work/$base"
          echo "PACKED_IMAGE=$work/$base" >> "$GITHUB_ENV"
      - name: Sign and republish the AppImage
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          "${{ github.workspace }}/node_modules/.bin/tauri" signer sign "$PACKED_IMAGE"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "latest.json" --clobber
          SIG_FILE="$PACKED_IMAGE.sig" node -e '
            const fs = require("fs");
            const latest = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            const signature = fs.readFileSync(process.env.SIG_FILE, "utf8").trim();
            for (const platform of ["linux-x86_64", "linux-x86_64-appimage"]) {
              latest.platforms[platform].signature = signature;
            }
            fs.writeFileSync("latest.json", JSON.stringify(latest, null, 2));
          '
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$PACKED_IMAGE" "$PACKED_IMAGE.sig" latest.json --clobber
