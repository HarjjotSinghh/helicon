name: Release

on:
  push:
    tags: ["v*"]

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build --workspace @helicon/daemon --workspace @helicon/ui --workspace @helicon/server
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Helicon ${{ github.ref_name }} (Unofficial)"
          releaseBody: "Unofficial community build. Not made, endorsed, or supported by Meta. Requires Node.js 22+ and the Muse CLI (WSL2 Ubuntu on Windows) with muse login."
          releaseDraft: false
          prerelease: true
          args: --target x86_64-pc-windows-msvc
