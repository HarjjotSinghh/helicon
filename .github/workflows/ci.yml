name: CI

on:
  push:
    branches: [prod]
  pull_request:

jobs:
  node:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @helicon/daemon --workspace @helicon/ui --workspace @helicon/server
      - run: npm run test --workspace @helicon/daemon --workspace @helicon/ui --workspace @helicon/server
      - run: npm run build --workspace @helicon/web
      - run: npm run test --workspace @helicon/web

  # The desktop crate is only otherwise compiled while cutting a release, which is far too late to
  # find out that it does not build.
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # tauri-build reads frontendDist out of tauri.conf.json, and that directory is built, not committed.
      - run: npm ci
      - run: npm run build --workspace @helicon/ui
      - run: npm run build --workspace @helicon/web
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
