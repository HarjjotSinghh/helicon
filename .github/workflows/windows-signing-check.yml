name: Windows signing check

# Builds the Windows installer from the chosen branch and signs it on SignPath without touching any release, so the
# SignPath project can be tried end to end (test-signing) before a real release depends on it. The signed installer
# is kept as a workflow artifact for a few days. Run it from the Actions tab or with:
#   gh workflow run windows-signing-check.yml -f signing-policy=test-signing
on:
  workflow_dispatch:
    inputs:
      signing-policy:
        description: SignPath signing policy slug
        default: test-signing
        required: true

permissions:
  contents: read
  # SignPath reads the unsigned installer back from this run's artifacts.
  actions: read

jobs:
  sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build --workspace @helicon/daemon --workspace @helicon/ui --workspace @helicon/server
      - name: Build installer
        id: build
        # PowerShell, like the release job: fetch-node.mjs unpacks Node with tar, and Git Bash's GNU tar reads a
        # "D:\..." path as a remote host. Under PowerShell the Windows tar runs instead.
        shell: pwsh
        env:
          HELICON_NODE_TARGET: x86_64-pc-windows-msvc
        run: |
          $ErrorActionPreference = 'Stop'
          # No updater artifacts: they need the release signing key, which this check does not get.
          $config = Join-Path $env:RUNNER_TEMP 'no-updater.json'
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -NoNewline -Encoding utf8NoBOM $config
          npm run tauri --workspace helicon-desktop -- build --target x86_64-pc-windows-msvc --bundles nsis --config $config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Helicon_*_x64-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one installer, got: $($installers.Name -join ', ')" }
          New-Item -ItemType Directory -Force signing/unsigned | Out-Null
          Copy-Item $installers[0].FullName signing/unsigned/
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "name=$($installers[0].Name)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-unsigned
          path: signing/unsigned/
          if-no-files-found: error
      # Pinned to a commit: this step holds the SignPath API token.
      - name: Sign installer on SignPath
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: helicon
          signing-policy-slug: ${{ inputs.signing-policy }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signing/signed
          parameters: |
            version: ${{ toJSON(steps.build.outputs.version) }}
      - name: Check the signature
        shell: pwsh
        env:
          SIGNING_POLICY: ${{ inputs.signing-policy }}
        run: ./.signpath/check-signature.ps1 "signing/signed/${{ steps.build.outputs.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-signed
          path: signing/signed/
          retention-days: 7
